name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Format check with ruff
        run: ruff format --check src/ tests/

      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term -v
        env:
          APP_ENV: test
          DUCKDB_PATH: ":memory:"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t bevar-email-handler:${{ github.sha }} .

      - name: Verify image
        run: docker run --rm bevar-email-handler:${{ github.sha }} python -c "from src.api.app import app; print('OK')"

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Lightsail via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            APP_DIR=~/bevar-ukraine-smart-email-handler-AK

            # First deploy: clone repo via HTTPS (no SSH key needed)
            if [ ! -d "$APP_DIR" ]; then
              git clone https://github.com/VectoraAI/bevar-ukraine-smart-email-handler-AK.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Preserve .env (not in git, lives only on server)
            cp .env /tmp/.env.bak 2>/dev/null || true

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Restore .env
            cp /tmp/.env.bak .env 2>/dev/null || true

            # Rebuild and restart container (keep data volume)
            docker compose down
            docker compose up -d --build

            # Wait for health check
            echo "Waiting for app to start..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/api/health > /dev/null 2>&1; then
                echo "App is healthy!"
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed after 60s"
            docker compose logs --tail=50
            exit 1
