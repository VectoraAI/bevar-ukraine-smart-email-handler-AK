name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Format check with ruff
        run: ruff format --check src/ tests/

      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term -v
        env:
          APP_ENV: test
          DUCKDB_PATH: ":memory:"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t bevar-email-handler:${{ github.sha }} .

      - name: Verify image
        run: docker run --rm bevar-email-handler:${{ github.sha }} python -c "from src.api.app import app; print('OK')"

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build and tag Docker image
        run: |
          docker build -t bevar-email-handler:latest -t bevar-email-handler:${{ github.sha }} .

      # Add registry push and deployment steps as needed
      # Example:
      # - name: Push to registry
      #   run: |
      #     docker tag bevar-email-handler:${{ github.sha }} ${{ secrets.REGISTRY }}/bevar-email-handler:${{ github.sha }}
      #     docker push ${{ secrets.REGISTRY }}/bevar-email-handler:${{ github.sha }}
